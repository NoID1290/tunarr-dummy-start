name: Tunarr Dummy Start CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  bump:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Auto-Version Bump
      shell: pwsh
      run: |
        ./bump-version.ps1
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .\TunarrDummyStart\TunarrDummyStart.csproj
        $status = git status --porcelain
        if ($status) {
          git commit -m "chore: bump version [skip ci]"
          git push
        } else {
          Write-Host "No version changes to commit."
        }

  build:
    needs: bump
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Pull latest changes (if bump occurred)
      if: needs.bump.result == 'success'
      run: git pull

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore the application
      run: dotnet restore .\TunarrDummyStart\TunarrDummyStart.csproj

    - name: Build the application
      run: dotnet build .\TunarrDummyStart\TunarrDummyStart.csproj -c ${{ matrix.configuration }} --no-restore

    - name: Publish the application
      if: matrix.configuration == 'Release'
      run: dotnet publish .\TunarrDummyStart\TunarrDummyStart.csproj -c Release --no-restore -o .\artifacts\publish

    - name: Upload build artifacts
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: TunarrDummyStart-win-x64
        path: .\artifacts\publish

  build-android:
    needs: bump
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Pull latest changes (if bump occurred)
      if: needs.bump.result == 'success'
      run: git pull

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Get Version from Project File
      id: get_version
      run: |
        VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' TunarrDummyStart/TunarrDummyStart.csproj)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Grant execute permission for gradlew
      run: chmod +x ./TunarrDummyStartAndroid/gradlew

    - name: Generate self-signed Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TunarrDummy, O=NoID, C=US" -storepass password -keypass password

    - name: Build with Gradle
      run: |
        cd TunarrDummyStartAndroid
        ./gradlew assembleRelease -PversionName=${{ env.VERSION }}

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: TunarrDummyStart-android
        path: TunarrDummyStartAndroid/app/build/outputs/apk/release/*.apk

  release:
    needs: [build, build-android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: TunarrDummyStart-win-x64
        path: release-win

    - name: Download Android Artifact
      uses: actions/download-artifact@v4
      with:
        name: TunarrDummyStart-android
        path: release-android

    - name: Get Version from Project File
      id: get_version
      run: |
        VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' TunarrDummyStart/TunarrDummyStart.csproj)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create and Push Tag
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        if ! git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
          git tag "v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"
        else
          echo "Tag v${{ env.VERSION }} already exists."
        fi

    - name: Prepare Assets
      run: |
        mv release-win/TunarrDummyStart.exe ./TunarrDummyStart.exe
        mv release-android/*.apk ./TunarrDummyStart-android.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: Tunarr Dummy Start v${{ env.VERSION }}
        body: |
          Automated release for version v${{ env.VERSION }}.
          
          ### Downloads:
          - **[TunarrDummyStart.exe](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/TunarrDummyStart.exe)** (Windows WinForms executable)
          - **[TunarrDummyStart-android.apk](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/TunarrDummyStart-android.apk)** (Android application package, unsigned release)
        draft: false
        prerelease: false
        files: |
          TunarrDummyStart.exe
          TunarrDummyStart-android.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
