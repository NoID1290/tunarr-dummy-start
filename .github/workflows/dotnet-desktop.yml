name: Tunarr Dummy Start CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore the application
      run: dotnet restore .\TunarrDummyStart\TunarrDummyStart.csproj

    - name: Build the application
      run: dotnet build .\TunarrDummyStart\TunarrDummyStart.csproj -c ${{ matrix.configuration }} --no-restore

    - name: Publish the application
      if: matrix.configuration == 'Release'
      run: dotnet publish .\TunarrDummyStart\TunarrDummyStart.csproj -c Release --no-restore -o .\artifacts\publish

    - name: Upload build artifacts
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: TunarrDummyStart-win-x64
        path: .\artifacts\publish
