name: Tunarr Dummy Start CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  bump:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Auto-Version Bump
      shell: pwsh
      run: |
        ./bump-version.ps1
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .\TunarrDummyStart\TunarrDummyStart.csproj
        $status = git status --porcelain
        if ($status) {
          git commit -m "chore: bump version [skip ci]"
          git push
        } else {
          Write-Host "No version changes to commit."
        }

  build:
    needs: bump
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Pull latest changes (if bump occurred)
      if: needs.bump.result == 'success'
      run: git pull

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore the application
      run: dotnet restore .\TunarrDummyStart\TunarrDummyStart.csproj

    - name: Build the application
      run: dotnet build .\TunarrDummyStart\TunarrDummyStart.csproj -c ${{ matrix.configuration }} --no-restore

    - name: Publish the application
      if: matrix.configuration == 'Release'
      run: dotnet publish .\TunarrDummyStart\TunarrDummyStart.csproj -c Release --no-restore -o .\artifacts\publish

    - name: Upload build artifacts
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: TunarrDummyStart-win-x64
        path: .\artifacts\publish
